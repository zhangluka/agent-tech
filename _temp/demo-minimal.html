<style>

  body {

    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 56px; position: sticky; top: 0;
    background: rgba(255,255,255,0.85); backdrop-filter: blur(12px);
    z-index: 100; border-bottom: 1px solid #f0f0f0;
  }
  .nav-logo { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
  .nav-links { display: flex; gap: 28px; font-size: 14px; color: #6b7280; align-items: center; }
  .nav-links a:hover { color: #0a0a0a; }
  .nav-links .gh { width: 18px; height: 18px; opacity: 0.5; transition: opacity 0.2s; }
  .nav-links .gh:hover { opacity: 1; }
  .hero { text-align: center; padding: 120px 56px 80px; }
  .hero-title { font-size: 64px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.05; margin-bottom: 16px; }
  .hero-sub { font-size: 18px; color: #6b7280; max-width: 480px; margin: 0 auto 40px; line-height: 1.6; }
  .btn-primary {
    display: inline-block; background: #635bff; color: #fff;
    padding: 14px 32px; border-radius: 8px; font-size: 15px; font-weight: 500;
    transition: background 0.15s, transform 0.15s;
  }
  .btn-primary:hover { background: #5147e5; transform: translateY(-1px); }
  .phases {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
    padding: 0 56px 48px; max-width: 1120px; margin: 0 auto;
  }
  .phase-card {
    border: 1px solid #e5e7eb; border-radius: 12px; padding: 32px 24px 28px;
    transition: box-shadow 0.2s, border-color 0.2s;
  }
  .phase-card:hover { border-color: #d1d5db; box-shadow: 0 4px 24px rgba(0,0,0,0.04); }
  .phase-num { font-size: 13px; font-weight: 700; color: #635bff; font-family: 'JetBrains Mono', monospace; margin-bottom: 16px; }
  .phase-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
  .phase-desc { font-size: 14px; color: #6b7280; line-height: 1.55; }
  .phase-chapters { margin-top: 18px; font-size: 12px; color: #9ca3af; font-weight: 500; }
  .footer {
    text-align: center; padding: 32px 56px 48px;
    font-size: 13px; color: #9ca3af; border-top: 1px solid #f0f0f0;
    max-width: 1120px; margin: 0 auto;
  }
